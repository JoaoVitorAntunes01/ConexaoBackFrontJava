<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Cadastro</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center vh-100">
      <div class="card shadow p-4 rounded-4" style="width: 100%; max-width: 450px;">

        <div class="mb-3">
          <a href="/login" class="btn btn-outline-danger btn-sm">← Voltar</a>
        </div>

        <h3 class="text-center text-primary mb-4">Cadastro</h3>

        <form th:action="@{/registrar}" th:object="${user}" method="post" onsubmit="return validarFormulario()">

          <div class="mb-3">
            <label for="nome" class="form-label">Nome Completo</label>
            <input type="text" class="form-control" th:field="*{nome}" id="nome">
            <div class="invalid-feedback">Por favor, informe seu nome completo.</div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" th:field="*{email}" id="email">
            <div class="invalid-feedback">Por favor, informe um e-mail válido.</div>
          </div>

          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control" th:field="*{senha}" id="senha">
            <div class="invalid-feedback">A senha deve ter pelo menos 6 caracteres.</div>
          </div>

          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary btn-lg">Cadastrar</button>
          </div>

        </form>
      </div>
    </div>
  </body>
</html>
