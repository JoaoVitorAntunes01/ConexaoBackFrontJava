<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Login</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center vh-100">

      <div class="card shadow p-4 rounded-4" style="width: 100%; max-width: 400px;">

        <div class="mb-3">
          <a href="/" class="btn btn-outline-secondary btn-sm">← Voltar</a>
        </div>

        <h3 class="text-center text-primary mb-4">Login</h3>

        <form th:action="@{/logar}" th:object="${credenciais}" method="post">

          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-control" th:field="*{email}">
          </div>

          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" class="form-control" th:field="*{senha}">
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
              Logar
            </button>
          </div>

        </form>

      </div>

    </div>

  </body>
</html>
