<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Login</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center vh-100">
      <div class="card shadow p-4 rounded-4" style="width: 100%; max-width: 400px;">

        <div class="mb-3">
          <a href="/" class="btn btn-outline-danger btn-sm">← Voltar</a>
        </div>

        <h3 class="text-center text-primary mb-4">Login</h3>

        <form th:action="@{/logar}" th:object="${credenciais}" method="post" onsubmit="return validarFormulario()">

          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" th:field="*{email}" id="email">
            <div class="invalid-feedback">Por favor, informe um e-mail válido.</div>
          </div>

          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control" th:field="*{senha}" id="senha">
            <div class="invalid-feedback">A senha deve ter pelo menos 6 caracteres.</div>
          </div>

          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary btn-lg">Logar</button>
          </div>

        </form>
      </div>
    </div>

    <script>
      const campos = [
        { id: 'email', check: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) },
        { id: 'senha', check: v => v.length >= 6 }
       ];

       function validarFormulario() {
        let valido = true;

       campos.forEach(({ id, check }) => {
        const input = document.getElementById(id);
        const ok = check(input.value);
        input.classList.toggle('is-invalid', !ok);
        if (!ok) valido = false;
     });

    return valido;
}
    </script>
  </body>
</html>
